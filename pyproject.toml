[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-security-headers-audit"
version = "0.1.0"
description = "CLI that audits HTTP security headers and writes JSON/HTML reports. For authorized testing only."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Harpreet Singh"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
webheaders = "webheaders.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
